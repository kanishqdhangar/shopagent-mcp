name: Buyer agent tests

on:
  push:
  pull_request:

jobs:
  buyer-agent:
    runs-on: ubuntu-latest
    container: python:3.11-slim
    services:
      redis:
        image: redis/redis-stack-server:latest
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://shopagent:shopagent@localhost:5432/shopagent
      GEMINI_API_KEY: ci-placeholder-not-used-by-tests
      RAZORPAY_WEBHOOK_SECRET: ci-placeholder-not-used-by-tests
      REDIS_URL: redis://redis:6379/0
      MCP_SERVER_URL: http://seller:8000/mcp/
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install buyer-agent dependencies
        working-directory: buyer_agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run buyer-agent test suite
        working-directory: buyer_agent
        run: python -m pytest -q -p no:cacheprovider
